<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title> ToDay | The Modern To-Do List </title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Preconnect to Google Fonts servers for faster loading -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        
        <!-- Import the Huninn font stylesheet -->
        <link href="https://fonts.googleapis.com/css2?family=Huninn:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="header">
            <div class="brand">
                <span id="to"><strong>To</strong></span><span id="day"><strong>Day</strong></span>
                <p>The Modern To-Do List</p>
            </div>

            <div class="newTask">
                <p> New Task + </p>
            </div>
        </header>

        <main class="board">
            <section class="column">
                <h2>To Do</h2>
                <hr>
                <!-- Task cards -->
            </section>

            <section class="column">
                <h2>In Progress</h2>
                <hr>
                <!-- Task cards -->
            </section>

            <section class="column">
                <h2>Completed</h2>
                <hr>
                <!-- Task cards -->
            </section>
        </main>
        <div class="dial" id="dial">
            <div class="inner-dial"></div>
            <div id="pointer"></div>
            <p id="time">00.00</p>
        </div>
        
        <script src="tutorial.js" type="module"></script>
        <script src="main.js" type="module"></script>
        <script src="dial.js" type="module"></script>
    </body>
</html>
